<template>

    <section class="hero">

                    Advanced Expense Tracker

                <p>

                    <lightning-button

            </div>

                    <p>

                        stay within your budget,
                        and gain complete financial insights.

                    </p>

                        <div>

                            <h3>

                                ₹ {dashboard.totalBudget}

                            </h3>

                            <span>Total Budget</span>

                        </div>

                        <div>

                            <h3>

                                {dashboard.totalTransactions}

                            </h3>

                            <span>Transactions</span>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </section>

    <!-- ========================================================= -->
    <!-- KPI CARDS -->
    <!-- ========================================================= -->

    <section class="kpi-grid">

        <div class="kpi-card">

            <div class="icon blue">

                💰

            </div>

            <div>

                <span>Total Budget</span>

                <h2>

                    ₹ {dashboard.totalBudget}

                </h2>

            </div>

        </div>

        <div class="kpi-card">

            <div class="icon orange">

                💳

            </div>

            <div>

                <span>Total Expenses</span>

                <h2>

                    ₹ {dashboard.totalExpense}

                </h2>

            </div>

        </div>

        <div class="kpi-card">

            <div class="icon green">

                ✅

            </div>

            <div>

                <span>Remaining Budget</span>

                <h2>

                    ₹ {dashboard.remainingAmount}

                </h2>

            </div>

        </div>

        <div class="kpi-card">

            <div class="icon purple">

                📄

            </div>

            <div>

                <span>Transactions</span>

                <h2>

                    {dashboard.totalTransactions}

                </h2>

            </div>

        </div>

    </section>

    <!-- ========================================================= -->
    <!-- QUICK ACTIONS -->
    <!-- ========================================================= -->

    <section class="quick-actions">

        <div class="section-title">

        <div class="action-grid">

            <div

                    icon-name="utility:add"
                    size="large">
                </lightning-icon>

                <h3>Add Expense</h3>

                <p>

                    Record a new expense.

                </p>

            </div>

            <div
                class="action-card"
                onclick={navigateToBudget}>

                <lightning-icon
                    icon-name="utility:moneybag"
                    size="large">
                </lightning-icon>

                <h3>Create Budget</h3>

                <p>

                    Manage monthly budgets.

                </p>

            </div>

            <div
                class="action-card"
                onclick={navigateToReports}>

                <lightning-icon
                    icon-name="utility:chart"
                    size="large">
                </lightning-icon>

                <h3>Reports</h3>

                <p>

                    View analytics.

                </p>

            </div>

            <div
                class="action-card"
                onclick={navigateToDashboard}>

                <lightning-icon
                    icon-name="utility:dashboard"
                    size="large">

                <p>

                    Financial overview.

                </p>

            </div>

        </div>

    </section>

    <!-- ========================================================= -->

    <section class="budget-section">

        <div class="section-title">

            <h2>Budget Utilization</h2>

            <p>Track how much of your budget has been used</p>

        </div>

        <div class="budget-card">

            <div class="budget-header">

                <span>Budget Used</span>

                <span>{dashboard.usedPercentage}%</span>

            </div>

            <lightning-progress-bar
                value={dashboard.usedPercentage}
                size="large">
            </lightning-progress-bar>

        </div>

    </section>

    <!-- ========================================================= -->
    <!-- EXPENSE ANALYTICS -->
    <!-- ========================================================= -->

    <section class="analytics-section">

        <div class="section-title">

            <h2>Expense Analytics</h2>

            <p>Monthly category-wise expense overview</p>

        </div>

        <div class="analytics-grid">

            <div class="analytics-card">

                <div class="circle blue">

                    <span>Food</span>

                </div>

                <h3>₹5,000</h3>

            </div>

            <div class="analytics-card">

                <div class="circle green">

                    <span>Bills</span>

                </div>

                <h3>₹4,200</h3>

            </div>

            <div class="analytics-card">

                <div class="circle orange">

                    <span>Travel</span>

                </div>

                <h3>₹3,500</h3>

            </div>

            <div class="analytics-card">

                <div class="circle purple">

                    <span>Shopping</span>

                </div>

                <h3>₹2,500</h3>

            </div>

        </div>

    </section>

    <!-- RECENT EXPENSES -->
    <!-- ========================================================= -->

    <section class="expense-table">

        <div class="section-title">

            <h2>Recent Expenses</h2>

            <lightning-button
                label="View All"
                variant="brand"
                onclick={navigateToExpense}>
            </lightning-button>

        </div>

        <lightning-datatable

            key-field="Id"

            data={recentExpenses}

            columns={columns}

            hide-checkbox-column>

        </lightning-datatable>

    </section>

    <!-- FEATURES -->
    <!-- ========================================================= -->

    <section class="feature-grid">

        <div class="feature-card">

            <lightning-icon
                icon-name="utility:moneybag"
                size="large">
            </lightning-icon>

            <p>

            </p>

        </div>

        <div class="feature-card">

            <lightning-icon
                icon-name="utility:chart"
                size="large">
            </lightning-icon>

            <h3>Smart Reports</h3>

                Visualize expenses with Salesforce reports
                and dashboards.
            </p>

        </div>

        <div class="feature-card">

            <lightning-icon
                icon-name="utility:flow"
